services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${HOMELAB_DB_PASSWORD:?Set HOMELAB_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - homelab-postgres-data:/var/lib/postgresql

  homelab-api:
    image: 192.168.8.11:5080/homelab-api:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "3000"
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://homelab:${HOMELAB_DB_PASSWORD:?Set HOMELAB_DB_PASSWORD in .env}@postgres:5432/homelab?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://tauri.localhost,tauri://localhost
    ports:
      - "${HOMELAB_PORT:-3000}:3000"

volumes:
  homelab-postgres-data:
